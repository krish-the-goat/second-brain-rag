name: CI & Evaluation Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run linter
        run: ruff check backend/app/
        working-directory: backend

      - name: Run backend tests
        env:
          API_KEY: test-api-key-12345
          API_KEYS: test-api-key-12345,second-key-67890
          GOOGLE_API_KEY: fake-key
          GROQ_API_KEY: fake-key
          CACHE_BACKEND: memory
          OTEL_ENABLED: "false"
        run: pytest --tb=short -q
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  ragas-eval:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r evaluation/requirements.txt

      - name: Generate test documents
        run: python evaluation/generate_test_docs.py

      - name: Ingest test documents
        env:
          CACHE_BACKEND: memory
          OTEL_ENABLED: "false"
        run: python evaluation/ingest_test_docs.py

      - name: Run RAG evaluation
        env:
          CACHE_BACKEND: memory
          OTEL_ENABLED: "false"
          RAGAS_MIN_RECALL: "0.70"
          RAGAS_MIN_PRECISION: "0.60"
        run: python evaluation/custom_eval.py

      - name: Upload Evaluation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: evaluation/reports/
