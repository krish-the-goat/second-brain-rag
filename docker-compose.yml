version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - neo4j
      - redis
      - chroma
    volumes:
      - bm25_data:/app/bm25_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      # API_KEY is injected at runtime by Nginx via envsubst — do NOT use VITE_ prefix here.
      # The frontend itself never exposes the key; Nginx adds it server-side on every proxied request.
      - API_KEY=${API_KEY}
    depends_on:
      - backend

  neo4j:
    image: neo4j:5
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-strongpassword}
    volumes:
      - neo4j_data:/data

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN:-default-strong-token}
    volumes:
      - chroma_data:/chroma/chroma

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-strongpassword}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

networks:
  default:
    driver: bridge

volumes:
  neo4j_data:
  chroma_data:
  redis_data:
  bm25_data:
