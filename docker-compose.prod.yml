version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # No volumes needed for backend since DBs are external containers
    networks:
      - rag_network
    depends_on:
      - neo4j
      - redis
      - chroma

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - API_KEY=${API_KEY}
    networks:
      - rag_network
    depends_on:
      - backend

  neo4j:
    image: neo4j:latest
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-secretpassword}
    volumes:
      - neo4j_data:/data
    networks:
      - rag_network

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - rag_network
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_AUTH_PROVIDER=chromadb.auth.token.TokenAuthServerProvider
      - CHROMA_SERVER_AUTH_CREDENTIALS_FILE=/chroma/auth.json
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN:-default-strong-token}

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-strongpassword}
    networks:
      - rag_network
    volumes:
      - redis_data:/data

networks:
  rag_network:
    driver: bridge

volumes:
  neo4j_data:
  chroma_data:
  redis_data:
