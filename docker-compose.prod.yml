version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # No volumes needed for backend since DBs are external containers
    networks:
      - rag_network
    depends_on:
      - neo4j
      - redis
      - chroma

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - rag_network
    depends_on:
      - backend

  neo4j:
    image: neo4j:latest
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - rag_network

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - rag_network
    environment:
      - IS_PERSISTENT=TRUE

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - rag_network
    volumes:
      - redis_data:/data

networks:
  rag_network:
    driver: bridge

volumes:
  neo4j_data:
  chroma_data:
  redis_data:
